<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Rahle</title>
<script>/* Tema: ilk boyamadan önce kayıtlı tercihi uygula. */
(function(){try{var t=JSON.parse(localStorage.getItem('rahle.tema'));document.documentElement.dataset.theme=t==='acik'?'light':t==='koyu'?'dark':'system';}catch(e){}})();
</script>
<style>
/* Giriş sayfası: Rahle'nin şifreli kopyasını açar ve ortak kayıt bağlantısını (mühürlü erişim anahtarı) Rahle'ye
   köprüyle verir. Şifre çözme yalnız tarayıcıda yapılır. Eşitlemeyi Rahle içindeki ortak kayıt modülü yürütür; bu sayfa
   Rahle'nin üstüne hiçbir şey çizmez. */
:root {
  color-scheme: light;
  --bg: #f3f2ee; --paper: #fcfcfb; --ink: #1c2422; --ink-2: #4f5754; --line: #cfccc3;
  --accent: #1f5c4b; --accent-2: #2a7a64; --bad: #b3261e; --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 10px 30px rgba(20,30,25,.10); --btn-ink: #fff;
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121412; --paper: #1a1a19; --ink: #eceee9; --ink-2: #c3c2b7; --line: #3d403b;
    --accent: #6cc2a3; --accent-2: #86d4b7; --bad: #ff8a80; --focus: #6da7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --btn-ink: #10201a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --bg: #121412; --paper: #1a1a19; --ink: #eceee9; --ink-2: #c3c2b7; --line: #3d403b;
    --accent: #6cc2a3; --accent-2: #86d4b7; --bad: #ff8a80; --focus: #6da7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --btn-ink: #10201a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
#giris { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.kart { width: 100%; max-width: 380px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 28px 24px; }
h1 { font-size: 19px; margin: 0 0 4px; line-height: 1.3; }
.alt { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
button { width: 100%; margin-top: 20px; font: inherit; font-weight: 600; color: var(--btn-ink); background: var(--accent); border: 0; border-radius: 8px; padding: 11px 12px; cursor: pointer; }
button:hover { background: var(--accent-2); }
button:disabled { opacity: .6; cursor: progress; }
#durum { min-height: 22px; margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); }
#durum.hata { color: var(--bad); }
.not { margin: 18px 0 0; font-size: 12px; color: var(--ink-2); }
/* Girişteki tema seçimi: site teması ile aynı yerel tercih kullanılır. */
.tema-sec { display: flex; justify-content: flex-end; gap: 4px; margin: -8px -4px 16px; }
.tema-sec button { width: auto; margin: 0; min-height: 32px; padding: 5px 10px; border: 1px solid transparent; border-radius: 6px; color: var(--ink-2); background: transparent; font-size: 12px; font-weight: 600; }
.tema-sec button[aria-pressed="true"] { color: var(--btn-ink); background: var(--accent); border-color: var(--accent); }
.tema-sec button:not([aria-pressed="true"]):hover { color: var(--ink); background: var(--bg); }
.tema-sec button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
/* Kaynak paketi indirme göstergesi: yalnız indirme sürerken sayfanın üst kenarında 2 px'lik sakin çizgi; Rahle'nin
   alttaki durum satırını örtmez, tıklamayı engellemez; boştayken hiç çizilmez (ayrıntılı ilerlemeyi Rahle kendi
   'paket' olayıyla gösterir). */
#paket-gosterge { display: none; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 2; pointer-events: none; transition: opacity .4s ease; }
#paket-gosterge.acik { display: block; }
#paket-gosterge.bitti { opacity: 0; }
#paket-gosterge i { display: block; height: 100%; width: 0; background: var(--accent); opacity: .55; transition: width .2s linear; }
@media (prefers-reduced-motion: reduce) { #paket-gosterge, #paket-gosterge i { transition: none; } }
</style>
</head>
<body>
<main id="giris">
  <form class="kart" id="form" autocomplete="on">
    <div id="tema-secim" class="tema-sec" role="group" aria-label="Görünüm teması">
      <button type="button" data-tema="sistem" aria-pressed="true">Sistem</button>
      <button type="button" data-tema="acik" aria-pressed="false">☀ Açık</button>
      <button type="button" data-tema="koyu" aria-pressed="false">☾ Koyu</button>
    </div>
    <h1>Rahle</h1>
    <p class="alt">Buhârî şerh literatüründe tenkit · yalnız yetkili giriş</p>
    <label for="kullanici">Kullanıcı adı</label>
    <input id="kullanici" name="username" autocomplete="username" value="Admin" required>
    <label for="sifre">Şifre</label>
    <input id="sifre" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="gir" type="submit">Giriş</button>
    <p id="durum" role="status" aria-live="polite"></p>
    <p class="not">Sayfanın içeriği şifrelidir; şifre çözme bu tarayıcıda yapılır, şifre hiçbir yere gönderilmez. Kayıtlarınız bu tarayıcının deposunda kalır.</p>
  </form>
</main>
<iframe id="site" title="Rahle"></iframe>
<div id="paket-gosterge" aria-hidden="true"><i></i></div>
<script src="ortak.js"></script>
<script>
(function () {
  'use strict';
  var OTURUM = 'rahle.yayin.oturum', OTURUM_AD = 'rahle.yayin.kullanici';
  // localStorage anahtarı bilerek 'rahle.' önekli değil: Rahle'nin deposu o önekteki yerel olmayan anahtarları taşır.
  var YEREL_BAG = 'rahleYayin.ortak', MUHUR_EK = 'rahle-ortak';
  var VARSAYILAN = { depo: 'Ramazan9838/Rahle', dal: 'ortak-kayit', yayin: 'Ramazan9838/Buhkari_Criticism_Website' };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var kasa = null, anahtar = null, kullanici = 'Admin';
  var $ = function (id) { return document.getElementById(id); };

  function temaOku() {
    try { var t = JSON.parse(localStorage.getItem('rahle.tema')); if (['sistem', 'acik', 'koyu'].indexOf(t) >= 0) return t; } catch (e) {}
    return 'sistem';
  }
  function temaGoster(t) {
    document.documentElement.dataset.theme = t === 'acik' ? 'light' : t === 'koyu' ? 'dark' : 'system';
    var dugmeler = document.querySelectorAll('#tema-secim button[data-tema]');
    for (var i = 0; i < dugmeler.length; i++) dugmeler[i].setAttribute('aria-pressed', String(dugmeler[i].dataset.tema === t));
  }
  function temaSec(t) {
    if (['sistem', 'acik', 'koyu'].indexOf(t) < 0) return;
    temaGoster(t);
    try { localStorage.setItem('rahle.tema', JSON.stringify(t)); } catch (e) {}
    try { var w = $('site').contentWindow; if (w && w.App && w.App.tema) w.App.tema(t); } catch (e) {}
  }
  temaGoster(temaOku());
  var secimler = document.querySelectorAll('#tema-secim button[data-tema]');
  for (var si = 0; si < secimler.length; si++) secimler[si].addEventListener('click', function () { temaSec(this.dataset.tema); });

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64Yap(u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function durum(t, hata) { var d = $('durum'); d.textContent = t || ''; d.className = hata ? 'hata' : ''; }

  function kasaGetir() {
    return fetch('kasa.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('kasa.json okunamadı (' + r.status + ')');
      return r.json();
    }).then(function (k) { kasa = k; return k; });
  }

  // Şifreden anahtar türetilir (PBKDF2-SHA256), yuvadaki veri anahtarı onunla açılır (AES-GCM).
  function yuvaAc(ad, sifre) {
    var aranan = ad.trim().toLocaleLowerCase('tr');
    var y = kasa.yuvalar.filter(function (x) { return x.kullanici.toLocaleLowerCase('tr') === aranan; })[0];
    if (!y) return Promise.reject(new Error('giris'));
    return crypto.subtle.importKey('raw', enc.encode(sifre), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(y.salt), iterations: y.iter },
        k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kek) {
      var w = b64(y.w);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12), additionalData: enc.encode('rahle-yuva:' + y.kullanici) }, kek, w.slice(12));
    }).then(function (ham) { return { ham: ham, ad: y.kullanici }; }).catch(function () { throw new Error('giris'); });
  }

  // Veri anahtarı: şifreli parçaları açar ve ortak kayıt bağlantısını mühürler (AES-GCM).
  function anahtarKur(ham) {
    return crypto.subtle.importKey('raw', ham, 'AES-GCM', false, ['encrypt', 'decrypt']).then(function (k) { anahtar = k; return k; });
  }
  function muhurle(nesne) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(MUHUR_EK) }, anahtar, enc.encode(JSON.stringify(nesne))).then(function (c) {
      var u = new Uint8Array(12 + c.byteLength); u.set(iv); u.set(new Uint8Array(c), 12); return b64Yap(u);
    });
  }
  function muhurAc(metin) {
    var u = b64(metin);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode(MUHUR_EK) }, anahtar, u.slice(12)).then(function (a) { return JSON.parse(dec.decode(a)); });
  }

  // Sitenin şifreli parçaları indirilir, çözülür, birleştirilir ve gzip açılır.
  function dosyaAc(ad, ilerleme) {
    var d = kasa.dosyalar[ad], parcalar = [], bitti = 0;
    return Promise.all(d.parcalar.map(function (yol, i) {
      return fetch(yol).then(function (r) {
        if (!r.ok) throw new Error(yol + ' indirilemedi (' + r.status + ')');
        return r.arrayBuffer();
      }).then(function (buf) {
        var u = new Uint8Array(buf);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12), additionalData: enc.encode('rahle-parca:' + ad + ':' + i) }, anahtar, u.slice(12));
      }).then(function (acik) {
        parcalar[i] = acik; bitti++;
        if (ilerleme) ilerleme(bitti, d.parcalar.length);
      });
    })).then(function () {
      var akis = new Blob(parcalar).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(akis).text();
    });
  }

  /* =========================================================
     Ortak kayıt bağlantısı. İnce taneli GitHub erişim anahtarı (Contents RW: Rahle + yayın deposu) veri anahtarıyla
     mühürlenir ve yayındaki kasa.json'a `ortak` alanı olarak GitHub API ile yazılır; giriş yapan her bilgisayar
     kendiliğinden bağlanır. Yazılamazsa yalnız bu tarayıcıda (mühürlü) saklanır. Anahtar açık metin olarak hiçbir yere
     yazılmaz. Rahle bu bağlantıyı window.parent.__rahleOrtak köprüsünden alır (aynı köken: blob iframe); eşitleme,
     gösterge ve panel Rahle içindedir (parcalar/46_ortak-kayit.js). Birleştirme ve GitHub istemcisi ortak.js'tedir.
     ========================================================= */
  var O = window.RahleOrtak || null, bag = null, bagKaynak = '';
  function bagKur(b, kaynak) { bag = b && b.token ? Object.assign({}, VARSAYILAN, b) : null; bagKaynak = bag ? kaynak : ''; }
  function bagYukle() {
    if (!O || !anahtar) { bagKur(null); return Promise.resolve(null); }
    var kaynak = kasa && kasa.ortak ? muhurAc(kasa.ortak).then(function (b) { return { b: b, k: 'kasa' }; }) : Promise.reject();
    return kaynak.catch(function () {
      var y = null; try { y = localStorage.getItem(YEREL_BAG); } catch (e) {}
      return y ? muhurAc(y).then(function (b) { return { b: b, k: 'yerel' }; }) : null;
    }).catch(function () { return null; }).then(function (x) { bagKur(x && x.b, x && x.k); return bag; });
  }
  function depoYap(b, ad, dal) {
    var p = ad.split('/');
    return new O.Depo({ token: b.token, sahip: p[0], ad: p[1], dal: dal });
  }
  function utf8b64(t) { return b64Yap(enc.encode(t)); }
  // Mühürlü bağlantı yayın deposundaki kasa.json'a yazılır (anahtarın yayın deposuna da Contents yazma izni olmalı).
  function kasayaYaz(b, muhur) {
    var y = depoYap(b, b.yayin);
    return y.istek('GET', '/contents/kasa.json?ref=main').then(function (f) {
      var k = JSON.parse(dec.decode(b64(f.content.replace(/\s+/g, ''))));
      if (muhur) k.ortak = muhur; else delete k.ortak;
      return y.istek('PUT', '/contents/kasa.json', { message: 'Ortak kayıt bağlantısı ' + (muhur ? 'güncellendi' : 'kaldırıldı'), content: utf8b64(JSON.stringify(k, null, 1) + '\n'), sha: f.sha, branch: 'main' });
    }).then(function () { if (muhur) kasa.ortak = muhur; else delete kasa.ortak; });
  }
  function hataMetni(e, depo) {
    if (e && e.durum === 401) return 'Anahtar geçersiz (süresi dolmuş ya da yanlış).';
    if (e && (e.durum === 404 || e.durum === 403)) return 'Depoya erişilemedi: anahtarın ' + depo + ' deposuna Contents okuma/yazma izni olmalı.';
    if (e && e.ag) return 'GitHub\'a ulaşılamadı (çevrim dışı?).';
    return 'Bağlanılamadı: ' + (e && e.message || e);
  }
  window.__rahleOrtak = {
    surum: 1,
    lib: O,
    kullanici: function () { return kullanici; },
    // Bağlantı bilgisi (anahtarsız) ya da null
    bag: function () { return bag ? { depo: bag.depo, dal: bag.dal, yayin: bag.yayin, kaynak: bagKaynak, kimlik: bag.depo + '#' + bag.dal } : null; },
    depo: function () { return bag ? depoYap(bag, bag.depo, bag.dal) : null; },
    // Anahtar sınanır, mühürlenir, kasaya (olmazsa yalnız bu tarayıcıya) yazılır → {uyari?}
    baglan: function (token) {
      token = String(token || '').trim();
      if (!O || !anahtar) return Promise.reject(new Error('Ortak kayıt bu sayfada kullanılamıyor'));
      if (!token) return Promise.reject(new Error('Erişim anahtarı boş'));
      var aday = Object.assign({}, VARSAYILAN, { token: token });
      var d = depoYap(aday, aday.depo, aday.dal);
      return d.istek('GET', '').then(function () { return d.oku(null); }).catch(function (e) { throw new Error(hataMetni(e, aday.depo)); }).then(function () {
        return muhurle(aday);
      }).then(function (muhur) {
        try { localStorage.setItem(YEREL_BAG, muhur); } catch (e) {}
        bagKur(aday, 'yerel');
        return kasayaYaz(aday, muhur).then(function () { bagKaynak = 'kasa'; return {}; }, function (e) {
          return { uyari: 'Bağlantı yalnız bu tarayıcıya kaydedildi; yayına yazılamadı (' + (e && e.message || e) + '). Öteki bilgisayarlar için anahtarın ' + aday.yayin + ' deposuna da Contents yazma izni olmalı; ya da her bilgisayarda bir kez bağlanın.' };
        });
      });
    },
    // Bağlantı yayından ve bu tarayıcıdan kaldırılır (veri yerinde kalır)
    kaldir: function () {
      var b = bag;
      try { localStorage.removeItem(YEREL_BAG); } catch (e) {}
      bagKur(null);
      if (!b || !kasa || !kasa.ortak) return Promise.resolve({});
      return kasayaYaz(b, null).then(function () { return {}; }, function (e) { return { uyari: 'Bağlantı yayından kaldırılamadı (' + (e && e.message || e) + '); öteki bilgisayarlar bağlı kalabilir.' }; });
    }
  };

  /* Yayındaki ek şifreli dosyalar (site dışındakiler; ör. 'okuma': araç okuması, parcalar/47_okuma.js). Rahle varlığını ve
     özetini window.parent.__rahleDosyaBilgi(ad) ile, açık metnini window.parent.__rahleDosya(ad) ile alır (aynı köken). */
  window.__rahleDosyaBilgi = function (ad) {
    var d = ad !== 'site' && ad !== 'paket' && kasa && kasa.dosyalar && kasa.dosyalar[ad];
    return d && anahtar ? { ad: ad, ozet: d.ozet, boyut: d.boyut } : null;
  };
  window.__rahleDosya = function (ad) {
    if (!window.__rahleDosyaBilgi(ad)) return Promise.reject(new Error('yayında ' + ad + ' dosyası yok'));
    return dosyaAc(ad);
  };

  /* =========================================================
     Kaynak paketi köprüsü (KAYNAK_PAKETI_TASARIM §2.4, §5.2). Paket belge başına ayrı şifreli dosyadır
     (kasa.dosyalar.paket[belgeId] = {ozet, boyut, parcalar}; yayinla.py). Rahle (aynı köken: blob iframe):
       window.parent.__rahlePaketListe()                        → Promise<null | {surum: 1, manifest}>
       window.parent.__rahlePaket(belgeId, {ilerleme, sinyal})  → Promise<Uint8Array>  (gzip; şifresi çözülmüş, açılmamış)
     Hata: Error & {kod: 'yok' | 'ag' | 'butunluk' | 'iptal'}. Köprü önbellek tutmaz (Rahle kendi deposunda saklar);
     oturum açılırken hiçbir şey indirilmez. Bellek: belgeler sırayla, tek seferde tek belge indirilip çözülür
     (Rahle'nin en çok iki isteği kuyrukta bekler); bitince baytlar Rahle'ye geçer, burada tutulmaz.
     ========================================================= */
  var PAKET_ILETI = {
    yok: 'Bu belge yayındaki pakette yok.',
    ag: 'Belge indirilemedi: bağlantı yok (çevrim dışı?).',
    butunluk: 'İndirilen belge çözülemedi; yayın bozuk olabilir. Yeniden deneyin; sürerse yayını yenileyin.',
    iptal: 'İndirme durduruldu.'
  };
  function paketHatasi(kod, ek) { var e = new Error(PAKET_ILETI[kod] + (ek ? ' (' + ek + ')' : '')); e.kod = kod; return e; }
  function paketGirdi(id) {
    var p = kasa && kasa.dosyalar && kasa.dosyalar.paket;
    return anahtar && p && typeof id === 'string' && Object.prototype.hasOwnProperty.call(p, id) && p[id] && p[id].parcalar ? p[id] : null;
  }
  // Sakin gösterge: indirilen belgelerin toplamına göre üst kenarda ince çizgi.
  var gosterge = { alinan: 0, toplam: 0, zaman: 0 };
  function gostergeCiz(bitti) {
    var g = $('paket-gosterge'); if (!g) return;
    clearTimeout(gosterge.zaman);
    if (bitti) {
      if (g.className !== 'acik') return;
      g.firstChild.style.width = '100%';
      gosterge.zaman = setTimeout(function () {
        g.className = 'acik bitti';
        gosterge.zaman = setTimeout(function () { g.className = ''; g.firstChild.style.width = '0'; }, 450);
      }, 250);
      return;
    }
    g.className = 'acik';
    g.firstChild.style.width = (gosterge.toplam ? Math.min(100, 100 * gosterge.alinan / gosterge.toplam) : 0).toFixed(1) + '%';
  }
  // Bir şifreli parça akışla indirilir (bayt sayılır), sonra çözülür → ArrayBuffer (açık gzip dilimi).
  function parcaGetir(ad, i, yol, ctl, say) {
    return fetch(yol, { signal: ctl.signal }).catch(function (e) {
      throw ctl.signal.aborted ? paketHatasi('iptal') : paketHatasi('ag');
    }).then(function (r) {
      if (!r.ok) throw paketHatasi('ag', 'HTTP ' + r.status);
      if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function (b) { say(b.byteLength); return new Uint8Array(b); });
      var okuyucu = r.body.getReader(), dilimler = [], uz = 0;
      var oku = function () {
        if (ctl.signal.aborted) { try { okuyucu.cancel(); } catch (e) {} throw paketHatasi('iptal'); }
        return okuyucu.read().then(function (x) {
          if (x.done) {
            if (dilimler.length === 1) return dilimler[0];
            var u = new Uint8Array(uz), o = 0;
            for (var k = 0; k < dilimler.length; k++) { u.set(dilimler[k], o); o += dilimler[k].length; }
            dilimler = null; return u;
          }

      doc.head.appendChild(stil);


      /* Eski şifreli pakette .r-oku-tm-secim işaretleri yalnız renklidir:
         kesin ofsetin bağlı olduğu fiş koduyla aynı Kimlik kartı eylemine bağla.

      function fisliMetinBagla() {
        if (!app.state || (app.state.ekran !== 'okuHadis' && app.state.ekran !== 'okuTam')) return;
        var marks = doc.querySelectorAll('.r-oku-tm-p[data-pid] .r-pasaj mark.r-oku-tm-secim:not([data-eylem])');
        for (var i = 0; i < marks.length; i++) {
          var mark = marks[i], p = mark.closest('.r-oku-tm-p[data-pid]');
          var body = mark.closest('.r-pasaj');
          if (!p || !body || !p.dataset.belge || !p.dataset.pid) continue;
          var links = [];
          try { links = app.paket.bagliFisler(p.dataset.belge, p.dataset.pid) || []; } catch (e) { continue; }
          if (!links.length) continue;
          var offset = 0;
          try {
            var range = doc.createRange(); range.selectNodeContents(body); range.setEndBefore(mark);
            offset = range.toString().length;
          } catch (e) { continue; }
          var end = offset + mark.textContent.length;
          var codes = [];
          for (var j = 0; j < links.length; j++) {
            var g = links[j];
            if (!g || !g.kod || g.tam === false ||
                !Number.isInteger(g.secimBas) || !Number.isInteger(g.secimSon) ||
                g.secimBas < 0 || g.secimSon <= g.secimBas) continue;
            if (g.secimBas <= offset && g.secimSon >= end && codes.indexOf(g.kod) < 0) codes.push(g.kod);
          }
          if (!codes.length) continue;
          mark.dataset.eylem = codes.length > 1 ? 'okuP:fisListe' : 'okuP:fis';
          mark.dataset.kod = codes[0];
          if (codes.length > 1) mark.dataset.kodlar = JSON.stringify(codes);
          mark.setAttribute('role', 'button');
          mark.setAttribute('tabindex', '0');
          mark.setAttribute('title', codes.length > 1
            ? codes.length+' fiş · seçmek için tıklayın'

      /* Eski şifreli uygulamada da çoklu fiş seçim listesini aç.

      var acikFisListe = null;
      function listeyiKapat(odak) {
        var o = acikFisListe;
        if (!o) return;
        acikFisListe = null;
        doc.removeEventListener('pointerdown',o.disarida,true);
        doc.removeEventListener('keydown',o.tus,true);
        o.kutu.remove();
        if (odak && o.isaret.isConnected) try { o.isaret.focus({preventScroll:true}); } catch (e) {}
      }
      function eskiFisiSec(el) {
        if (!el || !el.dataset) return;
        if (acikFisListe && acikFisListe.isaret === el) { listeyiKapat(true); return; }
        listeyiKapat();
        var p = el.closest('.r-oku-tm-p[data-belge][data-pid]');
        if (!p) return;
        var codes;
        try { codes=JSON.parse(el.dataset.kodlar || '[]'); } catch(e) { return; }
        if (!Array.isArray(codes)) return;
        var baglar=[];
        try { baglar=app.paket.bagliFisler(p.dataset.belge,p.dataset.pid)||[]; } catch(e) { return; }
        var izin=new Set(baglar.map(function(a){return a && a.kod;}));
        codes=Array.from(new Set(codes.filter(function(k){return typeof k==='string' && izin.has(k);}))).slice(0,50);
        if (codes.length < 2) {
          if (codes.length) { app.nesne({tur:'fis',id:codes[0]});app.cekmece.ac('kimlik',{kaynak:'fare',sonOdak:el}); }

        var kutu=doc.createElement('div');kutu.className='r-oku-fis-secici';

        codes.forEach(function(k){
          var btn=doc.createElement('button');btn.type='button';btn.className='r-oku-fis-secici__satir';
          var f=app.veri.fis(k)||{},desc=f.tr||f.mesele||f.sarih||'';
          btn.textContent=k+(desc?' · '+String(desc).slice(0,76):'');
          btn.setAttribute('aria-label','Fiş '+k+' kimlik kartını aç');
          btn.addEventListener('click',function(){
            listeyiKapat();

          });
          kutu.appendChild(btn);
        });
        doc.body.appendChild(kutu);
        var r=el.getBoundingClientRect(),width=Math.min(340,Math.max(210,w.innerWidth-20));
        kutu.style.left=Math.round(Math.max(10,Math.min(w.innerWidth-width-10,r.left)))+'px';
        var height=kutu.getBoundingClientRect().height;
        kutu.style.top=Math.round(w.innerHeight-r.bottom>=Math.min(height+10,220)?r.bottom+6:Math.max(8,r.top-height-6))+'px';
        var disarida=function(e){if(!kutu.contains(e.target)&&e.target!==el)listeyiKapat();};
        var tus=function(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();listeyiKapat(true);}};
        acikFisListe={kutu:kutu,isaret:el,disarida:disarida,tus:tus};
        doc.addEventListener('pointerdown',disarida,true);
        doc.addEventListener('keydown',tus,true);
        var ilk=kutu.querySelector('button');if(ilk)ilk.focus({preventScroll:true});
      }
      app.eylem('okuP:fisListe',function(el){
        if (app.oku && typeof app.oku.fisListeAc==='function') app.oku.fisListeAc(el);

      function sinifDugmesi(etiket, action) {

      function tamMetindeYeniFis(belge, pid) {
        if (app.oku.yeniFisParagraf && app.oku.yeniFisParagraf !== tamMetindeYeniFis) return app.oku.yeniFisParagraf(belge, pid);
        if (!app.state || app.state.ekran !== 'okuTam') { app.durum('Bu işlemi Tam metin okumasında açın.'); return; }

        if (app.yazilabilir && !app.yazilabilir()) { app.durum('Bu sekme salt okunur.'); return; }
        app.paket.paragraf(belge, pid).then(function (p) {
          if (!p || p.tur !== 'p') { app.durum('Paragraf bulunamadı.'); return; }

      if (!app.oku.yeniFisParagraf) app.oku.yeniFisParagraf = tamMetindeYeniFis;

      /* Tam metin fişlemesi gizli bir çekmeceyle sınırlı kalmasın.

      /* Hadise göre ekranında, seçili şârih paragrafını doğrudan fişle.
         Buhârî ana metni ve başlık blokları kapsam dışıdır. */
      function hadiseGoreYeniFis(secim) {
        if (!secim || !secim.pid) secim = null;
        if (!app.state || app.state.ekran !== 'okuHadis') return;
        if (app.yazilabilir && !app.yazilabilir()) {
          app.durum('Bu sekme salt okunur; fiş oluşturulamaz.'); return;
        }
        var el = secim && secim.el && secim.el.isConnected ? secim.el : doc.querySelector('.r-oku-paket .r-oku-hd .r-oku-hd-bolum .r-oku-tm-p[aria-current][data-pid][data-belge]');
        if (!el) {
          app.durum('Önce Hadise göre ekranında fişlemek istediğiniz şârih paragrafına tıklayın.');
          return;
        }
        var belge = el.getAttribute('data-belge'), pid = el.getAttribute('data-pid');
        var oz = app.paket.belge(belge);
        if (!oz || !oz.sarih || oz.tur === 'metin' || oz.tur === 'mukaddime') {
          app.durum('Buhârî ana metni veya şerh olmayan metin fişlenemez.'); return;
        }
        var hash = w.location.hash;
        app.paket.paragraf(belge, pid).then(function (p) {
          if (!p || p.tur !== 'p') { app.durum('Fişlemek için bir şârih paragrafı seçin.'); return; }
          if (!app.state || app.state.ekran !== 'okuHadis' || w.location.hash !== hash) return;
          if (!doc.querySelector('.r-oku-hd-bolum [data-pid="' + (w.CSS && w.CSS.escape ? w.CSS.escape(pid) : pid.replace(/"/g, '')) + '"][aria-current]')) {
            app.durum('Seçili paragraf değişti; fişlemek istediğiniz paragrafı yeniden seçin.'); return;
          }
          var sarih = app.veri.sarih(oz.sarih) || {};
          var no = app.okuHadis && app.okuHadis.durum && app.okuHadis.durum();
          no = no && no.no;
          var kitap = p.kitab && p.kitab.ad || '';
          var bab = p.bab && p.bab.ad || '';
          var k = { tur: 'paragraf', sarih: oz.sarih, eser: sarih.eser || oz.eser || '',
            vefat: sarih.vefat || oz.vefat || '', kitab: kitap, bab: bab,
            hadis: no ? 'h. ' + no : '', buhariNo: no && Number(p.hadisNo) === Number(no) ? String(no) : '',
            kaynak: p.cilt ? p.cilt + '/' + p.sayfa : 's. ' + p.sayfa,
            nesir: '', konum: '', ar: p.metin || '', belge: belge, pid: p.pid || pid,
            kod: p.pid || pid, kitabMetin: kitap };
          if (!k.ar) { app.durum('Paragraf metni henüz yükleniyor.'); return; }
          if (app.cekmece.acik('kimlik')) app.cekmece.kapat('kimlik', { odakIade: false });
          app.oku.tezgah.ac(k, { secim: secim && secim.pid === pid ? secim : null });
        }).catch(function (e) { app.durum('Yeni fiş açılamadı: ' + (e && e.message || e)); });
      }
      function hadisUstFisDugmesi() {

      /* Hadise göre ekranında seçim üzerinde + ve Tekrar bak.
         Yeni kaynak uygulamada kendi r-oku-hd-hap öğesi varsa ikincisini oluşturma. */
      var hadisSecilen = null;
      function hadisSecimHapYenile() {
        if (!app.state || app.state.ekran !== 'okuHadis') {
          hadisSecilen = null;
          var once = doc.querySelector('.r-oku-hd-hap[data-rahle-kopru="1"]');

        }
        var kok = doc.querySelector('.r-ekran.r-oku-paket');

        var hap = kok.querySelector('.r-oku-hd-hap');

        if (!hap) {
          hap = doc.createElement('div');

          plus.className = 'r-dugme r-dugme--hayalet r-oku-hap__ekle';
          plus.textContent = '+';
          plus.setAttribute('aria-label', 'Seçili metinden yeni fiş aç');
          plus.title = 'Seçili metinden yeni fiş aç (N)';
          plus.addEventListener('pointerdown', function (e) { e.preventDefault(); });
          plus.addEventListener('click', function () {
            var sec = hadisSecilen;

          });
          var repeat = doc.createElement('button');

            var ozet = app.paket.belge(sec.belge);
            if (!ozet || !ozet.sarih || ozet.tur === 'metin' || ozet.tur === 'mukaddime') return;
            var kaynak;
            try { kaynak = await app.paket.paragraf(sec.belge, sec.pid); }
            catch (e) { app.durum('Paragraf bilgisi okunamadı: ' + (e && e.message || e)); return; }
            if (!kaynak || kaynak.tur !== 'p' || !sec.el.isConnected) return;
            var h = app.okuHadis && app.okuHadis.durum && app.okuHadis.durum();
            var k = { belge: sec.belge, pid: sec.pid, blok: sec.blok,

        var kr = kok.getBoundingClientRect(), rr = sec.rect;

        hap.hidden = false;
      }
      function dugmeYenile() {

      function fişKartiYenile() {
        if (!app.state || app.state.ekran !== 'okuTam') return;
        var kart = doc.querySelector('#cekmece-kimlik [data-y5-id="kimlik:paragraf"]');
        var n = app.state.nesne;

        var ayir = n.id.indexOf('|');

        if (oz && oz.sarih && oz.tur !== 'metin' && oz.tur !== 'mukaddime' &&
            (!app.yazilabilir || app.yazilabilir()) && !kart.parentNode.querySelector('.r-kimlik-paragraf__eylem')) {

function ozetle(rows) {
  const z={toplam:rows.length,hata:0,supheli:0,teyit:0,bagli:0,baglantisiz:0};
  for(const r of rows){ z[r.durum]=(z[r.durum]||0)+1;if(!r.links.length)z.baglantisiz++; }
  return z;
}
function derinSonuc(fis,bag,p) {
  if (!p) return {tur:'hata',baslik:'Paragraf bulunamadı',not:'İşaret edilen pid açılan belgenin iskeletinde bulunamadı.'};
  if (p.tur!=='p') return {tur:'supheli',baslik:'Bağlantı paragraf olmayan bloğa gidiyor',not:'Blok türü: '+p.tur};
  // Bağlantının yapısal hatası alıntı kontrolünden önce tespit edilmelidir.
  if (bag && bag.secimBas!=null&&bag.secimSon!=null) {
    const from=bag.secimBas,to=bag.secimSon;
    if(!Number.isInteger(from)||!Number.isInteger(to)||from<0||to<=from||to>String(p.metin||'').length)
      return {tur:'hata',baslik:'Seçim ofseti paragraf sınırının dışında',not:'Kaynak paragraf uzunluğu: '+String(p.metin||'').length};
  }
  const metin=sade(p.metin||''),alinti=sade(fis.ar||''),raw=String(fis.ar||'');
  if (!alinti) return {tur:'teyit',baslik:'Arapça alıntı bulunmuyor',not:'Alıntı yoksa dijital metin eşleşmiş sayılamaz.'};
  if (!metin) return {tur:'teyit',baslik:'Kaynak metin boş veya okunamadı',not:'Paragraf kimliği olsa da metin doğrulaması yapılamaz.'};
  // Word kaynaklı gerçek fişlerde (...) / ... / … pasajın atlanmış bölümüdür.
  // Bu alıntılar kesintisiz bir dize gibi aranmaz ve otomatik yanlış ilan edilmez.
  if (/\u2026|\.{3,}/.test(raw)) {
    const parcalar=raw.split(/\u2026|\.{3,}/).map(sade).filter(q=>q.length>=10);
    const bulunan=parcalar.filter(q=>metin.includes(q)).length;
    return {tur:'teyit',baslik:'Kesintili Arapça alıntı',not:parcalar.length
      ? 'Aynı paragrafta '+bulunan+'/'+parcalar.length+' anlamlı parça bulundu. Tam pasaj ve gerekirse komşu paragraflar elle teyit edilmeli.'
      : 'Alıntı yalnız kısaltılmış parçalar içeriyor; kaynakla kesin karşılaştırma yapılamaz.'};
  }
  if (alinti.length<16) return {tur:'teyit',baslik:'Kısa Arapça alıntı',not:metin.includes(alinti)
    ? 'İfade paragrafta geçiyor; ancak bu kısalıkta eşleşme tek başına kesin kanıt değildir.'
    : 'Kısa ifade bu paragrafta bulunamadı; farklı imla veya bağlam ihtimali ayrıca incelenmeli.'};
  if (!metin.includes(alinti))
    return {tur:'supheli',baslik:'Arapça alıntı kaynakla birebir eşleşmedi',not:'İmla, farklı nüsha, kısaltma veya yanlış eşleşme olabilir.'};
  // Paragrafta alıntının bulunması, fişin bağlandığı *kesin* işaretli
  // kelimelerin de doğru yerde olduğunu kanıtlamaz.
  // "tam:false" eski paragraf seviyeli bağlantıdır; metin aralığı iddiası yok.
  const secimVar = bag && bag.tam !== false &&
    Number.isInteger(bag.secimBas) && Number.isInteger(bag.secimSon);
  let seciliMetin = '';
  if (secimVar) {
    seciliMetin = String(p.metin || '').slice(bag.secimBas, bag.secimSon);
    const secili = sade(seciliMetin);
    if (secili.length >= 12 && !alinti.includes(secili) && !secili.includes(alinti))
      return {tur:'supheli',
        baslik:'Alıntı mevcut, ancak fişin işaretlediği metin farklı',
        not:'Dijital paragrafta alıntı geçiyor; kayıtlı seçim ofseti başka kelimelere denk geliyor. Yanlış aralık veya farklı nüsha ihtimali elle kontrol edilmeli.',
        kanit:{seciliMetin:seciliMetin.slice(0,300),alinti:String(fis.ar||'').slice(0,300)}};
  }
  const exact=/^\s*(?:c\.?\s*)?(\d+)\s*\/\s*(?:s\.?\s*)?(\d+)\s*$/.exec(String(fis.kaynak||''));
  if(exact && p.cilt!=null && p.sayfa!=null && (Number(exact[1])!==Number(p.cilt)||Number(exact[2])!==Number(p.sayfa)))
    return {tur:'supheli',baslik:'Cilt/sayfa uyuşmayabilir',not:'Fiş: '+fis.kaynak+'; dijital metin: '+p.cilt+'/'+p.sayfa};
  return {tur:'uyum',
    baslik:secimVar&&sade(seciliMetin).length>=12
      ? 'Alıntı ve işaretli aralık dijital paragrafla eşleşti'
      : 'Dijital paragrafla temel eşleşme sağlandı',
    not:'Bu sonuç matbu neşir teyidi değildir; hadis değerlendirmesinin ilmî doğrulaması anlamına gelmez.',
    kanit:secimVar?{seciliMetin:seciliMetin.slice(0,300),alinti:String(fis.ar||'').slice(0,300)}:null};
}

/* Bağlı paragrafta tek başına bulunmayan alıntı, önceki/sonraki paragraflarla
 * bitişik okunduğunda tam olarak eşleşebilir. Bu, kaynağın hatalı olduğu
 * anlamına gelmez; fişin kapsamını araştırmacı teyit etmelidir.
 * Esas derinSonuc fonksiyonu ve araştırma verisi değiştirilmez. */
function baglamSonucu(fis,bag,p,onceki,sonraki,ilk) {
  const sonuc=ilk||derinSonuc(fis,bag,p);
  if(!p||sonuc.tur!=='supheli')return sonuc;
  const q=sade(pilotAlinti(fis&&fis.ar).metin);
  if(q.length<16||/…|\.{3,}/.test(String(fis&&fis.ar||'')))return sonuc;
  const komsular=[onceki,sonraki].filter(v=>v&&v.tur==='p');
  if(!komsular.length)return sonuc;
  const metin=sade(p.metin||'');
  if(metin.includes(q))return sonuc;
  const tekKomsudaVar=komsular.some(v=>sade(v.metin||'').includes(q));
  // Alıntı bütünüyle yanlış komşu paragrafa bağlıysa "sınıra yayıldı"
  // denemez: bu kayıt ayrı kaynak-bağı şüphesi olarak kalır.
  if(tekKomsudaVar)return sonuc;
  const birlesik=sade([onceki,p,sonraki].filter(v=>v&&v.tur==='p').map(v=>v.metin).join(' '));
  if(!birlesik.includes(q))return sonuc;
  return {
    tur:'teyit',
    baslik:'Alıntı komşu paragraflara yayılıyor',
    not:'Alıntı bağlantılı paragrafın tek başına içinde değil, bitişik kaynak paragrafları birlikte okunduğunda bulunuyor. Paragraf kapsamı ve fişte seçilen metin elle teyit edilmeli; bu otomatik düzeltme veya matbu neşir doğrulaması değildir.',
    kanit:sonuc.kanit||null
  };
}


/* Şüpheli bir Arapça alıntıyla yerel paragrafın en uzun ortak KELİME dizisi.
   Yalnız izah ve insan kontrolü içindir, nihai eşleşme hükmü üretmez. */
function lafizKaniti(ar,p,bag) {
  if(!p || p.tur!=='p')return null;
  const alinti=pilotAlinti(ar).metin;
  const kelimeler=s=>String(s||'').normalize('NFKC')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
    .match(/[\u0621-\u064A]+/g)||[];
  const a=kelimeler(alinti).slice(0,500),b=kelimeler(p.metin).slice(0,1200);
  let prev=new Uint16Array(b.length+1),best=0,end=0;
  for(let i=1;i<=a.length;i++){
    const row=new Uint16Array(b.length+1);
    for(let j=1;j<=b.length;j++)if(a[i-1]===b[j-1]){
      row[j]=prev[j-1]+1;
      if(row[j]>best){best=row[j];end=i;}
    }
    prev=row;
  }
  const selected=bag&&Number.isInteger(bag.secimBas)&&Number.isInteger(bag.secimSon)&&
    bag.secimBas>=0&&bag.secimSon>bag.secimBas&&bag.secimSon<=p.metin.length
      ?p.metin.slice(bag.secimBas,bag.secimSon):'';
  const selectedNorm=sade(selected),alintiNorm=sade(alinti);
  return {
    ortakDizi:a.slice(end-best,end).join(' ').slice(0,300),
    ortakKelime:best,
    alintiKelime:a.length,
    seciliMetin:selected,
    seciliAlintida:!!(selectedNorm&&alintiNorm.includes(selectedNorm)),
    uyarı:'Ortak kelime sayısı otomatik doğrulama veya matbu neşir kontrolü değildir.'
  };
}


/* Karar sicili, kaynak-fiș tespitlerinden ve ortak-kayıt deposundan AYRIDIR.
 * Sadece bellekte çalışır; kullanıcı açıkça JSON dışa aktarmadıkça
 * localStorage, IndexedDB, sunucu veya araştırma verisine yazmaz.
 * İthal işleminde çakışan kararlar sessizce üzerine yazılmaz. */
function kararSicili() {
  const ALANLAR=['kod','belge','pid','dijitalDurum','karar','matbuDurum',
    'matbuSayfa','matbuDelil','gerekce','inceleyen'];
  const kararlar=['bekliyor','uyumlu','incele','duzeltme'];
  const matbu=['bekliyor','teyit','uyusmazlik'];
  const digital=['uyum','supheli','teyit','hata','bagli'];
  const veri=new Map();
  const key=(k,b,p)=>JSON.stringify([k,b,p]);
  const temiz=(v,max=3000)=>{
    if(typeof v!=='string')throw new Error('Karar alanı metin olmalı');
    if(v.length>max)throw new Error('Karar alanı çok uzun');
    return v.trim();
  };
  function alanlar(x){
    if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('Karar nesnesi geçersiz');
    const o={};
    for(const n of ALANLAR)o[n]=temiz(x[n]??'',n==='gerekce'||n==='matbuDelil'?3000:240);
    for(const n of ['kod','belge','pid'])if(!o[n])throw new Error('Fiş ve kaynak kimliği zorunlu');
    if(!kararlar.includes(o.karar))throw new Error('Araştırmacı kararı geçersiz');
    if(!matbu.includes(o.matbuDurum))throw new Error('Matbu teyit durumu geçersiz');
    if(!digital.includes(o.dijitalDurum))throw new Error('Dijital durum geçersiz');
    if(o.matbuDurum!=='bekliyor'&&(!o.matbuSayfa||!o.matbuDelil))
      throw new Error('Matbu hükmü için basılı sayfa ve Arapça delil zorunlu');
    if(o.karar!=='bekliyor'&&!o.gerekce)
      throw new Error('Araştırmacı kararı için gerekçe zorunlu');
    if(o.matbuDurum==='bekliyor'&&(o.matbuSayfa||o.matbuDelil))
      throw new Error('Matbu delil girildiyse önce matbu durumu seçin');
    return o;
  }
  function incele(e){
    if(!e||typeof e!=='object'||Array.isArray(e))throw new Error('Sicil kaydı geçersiz');
    const ref=alanlar(e.son);
    if(!Array.isArray(e.gecmis)||!e.gecmis.length||e.gecmis.length>200)
      throw new Error('Karar geçmişi eksik veya çok uzun');
    let once=null;
    const gecmis=e.gecmis.map(g=>{
      if(!g||typeof g!=='object'||Array.isArray(g)||typeof g.tarih!=='string'||
        g.tarih.length>40||!Number.isFinite(Date.parse(g.tarih)))
          throw new Error('Karar geçmişi tarih hatası');
      const karar=alanlar(g.karar);
      if(once && key(karar.kod,karar.belge,karar.pid)!==key(once.kod,once.belge,once.pid))
        throw new Error('Sicilde aynı fiş-bağ için farklı kimlikler');
      once=karar;
      return {tarih:g.tarih,karar};
    });
    const son=gecmis[gecmis.length-1].karar;
    if(JSON.stringify(son)!==JSON.stringify(ref))
      throw new Error('Karar geçmişi ve güncel karar tutarsız');
    return {anahtar:key(ref.kod,ref.belge,ref.pid),son:ref,gecmis};
  }
  const liste=()=>[...veri.values()].map(x=>JSON.parse(JSON.stringify(x)));
  const bul=(k,b,p)=>{
    const x=veri.get(key(k,b,p));
    return x?JSON.parse(JSON.stringify(x)):null;
  };
  const kaydet=(taslak,tarih)=>{
    const son=alanlar(taslak);
    const k=key(son.kod,son.belge,son.pid);
    const eskisi=veri.get(k);
    const at=new Date(tarih===undefined?Date.now():tarih);
    if(!Number.isFinite(at.getTime()))throw new Error('Karar tarihi geçersiz');
    const gelen={tarih:at.toISOString(),karar:son};
    const yeni={anahtar:k,son,gecmis:eskisi?[...eskisi.gecmis,gelen]:[gelen]};
    if(yeni.gecmis.length>200)throw new Error('200 adım geçmiş sınırına ulaşıldı');
    veri.set(k,yeni);
    return bul(son.kod,son.belge,son.pid);
  };
  const disaAktar=()=>JSON.stringify({
    tur:'rahle.kaynak-denetim.karar-sicili',surum:1,
    kayitlar:liste()
  },null,2)+'\n';
  const iceAktar=(raw)=>{
    if(typeof raw!=='string'||raw.length>2000000)throw new Error('JSON dosyası geçersiz veya çok büyük');
    const obj=JSON.parse(raw);
    if(!obj||obj.tur!=='rahle.kaynak-denetim.karar-sicili'||
       obj.surum!==1||!Array.isArray(obj.kayitlar)||obj.kayitlar.length>5000)
      throw new Error('Rahле karar sicili formatı veya sürümü geçersiz');
    const gecici=new Map();
    for(const rawEntry of obj.kayitlar){
      const entry=incele(rawEntry);
      if(entry.anahtar!==rawEntry.anahtar||gecici.has(entry.anahtar))
        throw new Error('Tekrarlı veya kimliği uyuşmayan sicil kaydı');
      const eski=veri.get(entry.anahtar);
      if(eski&&JSON.stringify(eski)!==JSON.stringify(entry))
        throw new Error('Çakışan karar geçmişi bulundu; hiçbir kayıt içe aktarılmadı');
      gecici.set(entry.anahtar,entry);
    }
    for(const [k,e] of gecici)veri.set(k,e);
    return gecici.size;
  };
  return {kaydet,bul,liste,disaAktar,iceAktar};
}

function kur(app,w,doc) {
  if (!app || !app.ekran || app.kaynakFisDenetimi) return;
  const get=()=>satirlar(app.VERI.fisler||[],
    kod=>app.veri.baglanti(kod),id=>app.paket&&app.paket.belge(id));
  const sicil=kararSicili();
  app.kaynakFisDenetimi={hesapla:get,ozetle,derinSonuc,sicil,surum:2};
  const h=(tag,metin,cl)=>{
    const e=doc.createElement(tag);if(cl)e.className=cl;
    if(metin!=null)e.textContent=String(metin);return e;
  };
  const line=(box,label,value)=>{
    const c=h('span',label+': '+value,'r-kd-sayi');box.appendChild(c);
  };
  app.ekran('kaynakFisDenetimi',{
    baslik:'Kaynak–Fiş Denetimi',alan:'denetim',rota:['/kaynak-denetim'],genis:true,
    render(kok,ctx) {
      ctx.kirinti(['Denetim','Kaynak–Fiş']);
      const root=h('section',null,'r-kaynak-denetim');kok.appendChild(root);
      root.appendChild(h('h2','Kaynak–Fiş Denetimi'));
      root.appendChild(h('p','Bu ekran yalnız tespit yapar; fişleri, meseleleri, kaynak bağlantılarını ve ortak kayıtları değiştirmez. Matbu teyit ayrı bir işlemdir.','r-kd-aciklama'));
      root.appendChild(h('p','Teyit bekleyen kayıtlar kesin hata değildir. Kaynak metinleri tarayıcıda hazır değilse bu sayı doğal olarak yüksek olur; fişlerin yanlış olduğunu göstermez.','r-kd-aciklama'));

      const sicilYenile=[];
      const sicilKutusu=h('section',null,'r-kd-karar-sicili');
      sicilKutusu.appendChild(h('h3','Araştırmacı karar sicili'));
      sicilKutusu.appendChild(h('p','Dijital bulgu ile araştırmacı hükmü ayrıdır. Matbu teyit için basılı sayfa ve Arapça delil zorunlu. Kararlar yalnız bu oturumun belleğinde tutulur; sayfadan ayrılmadan JSON olarak indirin. İndirilen dosya özel araştırma notları içerebilir.','r-kd-aciklama'));
      const sicilArac=h('div',null,'r-kd-pilot-arac');
      const indir=h('button','Karar sicilini JSON indir','r-dugme r-dugme--hayalet');
      indir.type='button';sicilArac.appendChild(indir);
      const yukleLabel=h('label','Sicil JSON içe aktar: ');
      const yukle=h('input');yukle.type='file';yukle.accept='.json,application/json';
      yukle.setAttribute('aria-label','Araştırmacı karar sicili dosyasını içe aktar');
      yukleLabel.appendChild(yukle);sicilArac.appendChild(yukleLabel);
      sicilKutusu.appendChild(sicilArac);
      const bildirim=h('p','Henüz kaydedilmiş araştırmacı kararı yok.','r-kd-not');
      bildirim.setAttribute('aria-live','polite');sicilKutusu.appendChild(bildirim);
      root.appendChild(sicilKutusu);
      const sicilDurum=(msg)=>{bildirim.textContent=sicil.liste().length+' kayıt · '+msg;};
      indir.onclick=()=>{
        try{
          const blob=new w.Blob([sicil.disaAktar()],{type:'application/json;charset=utf-8'});
          const url=w.URL.createObjectURL(blob),a=h('a');
          a.href=url;a.download='rahle-kaynak-fis-karar-sicili.json';
          doc.body.appendChild(a);a.click();a.remove();
          w.setTimeout(()=>w.URL.revokeObjectURL(url),0);
          sicilDurum('JSON indirme başlatıldı. Dosyayı güvenli saklayın.');
        }catch(e){sicilDurum('İndirme hatası: '+(e.message||e));}
      };
      yukle.onchange=async()=>{
        const file=yukle.files&&yukle.files[0];
        if(!file)return;
        try{
          if(file.size>2000000)throw new Error('Dosya 2 MB sınırını aşıyor');
          const n=sicil.iceAktar(await file.text());
          sicilYenile.forEach(f=>f());
          sicilDurum(n+' karar çakışmasız içe aktarıldı.');
        }catch(e){sicilDurum('İçe aktarma reddedildi: '+(e.message||e));}
        finally{yukle.value='';}
      };
      const kararPanel=(kod,bag,dijital)=>{
        const bolum=h('details',null,'r-kd-karar-panel');
        bolum.appendChild(h('summary','Araştırmacı kararı ve gerekçeli geçmiş'));
        const form=h('div',null,'r-kd-karar-form');
        const field=(etiket,el)=>{
          const l=h('label',etiket);l.appendChild(el);form.appendChild(l);return el;
        };
        const sec=(arr)=>{const e=h('select');for(const [v,t] of arr){const o=h('option',t);o.value=v;e.appendChild(o);}return e;};
        const karar=field('Araştırmacı kararı',sec([
          ['bekliyor','Henüz karar verilmedi'],['uyumlu','Dijital uyum kabul edildi'],
          ['incele','Ayrıntılı inceleme gerekli'],['duzeltme','Düzeltme önerisi']
        ]));
        const matbu=field('Matbu neşir',sec([
          ['bekliyor','Matbu teyit bekliyor'],['teyit','Matbu nüshadan teyit edildi'],
          ['uyusmazlik','Matbu nüsha ile uyuşmuyor']
        ]));
        const sayfa=h('input');sayfa.type='text';sayfa.maxLength=240;
        sayfa.placeholder='Neşir, cilt ve sayfa';field('Basılı neşir ve sayfa',sayfa);
        const delil=h('textarea');delil.rows=2;delil.maxLength=3000;delil.dir='rtl';
        delil.placeholder='Matbu sayfadaki Arapça ibare';field('Matbu Arapça delil',delil);
        const gerekce=h('textarea');gerekce.rows=2;gerekce.maxLength=3000;
        gerekce.placeholder='Hükmün dayanağı';field('Gerekçe',gerekce);
        const inceleyen=h('input');inceleyen.type='text';inceleyen.maxLength=240;
        field('İnceleyen (isteğe bağlı)',inceleyen);
        const button=h('button','Kararı sicile ekle','r-dugme r-dugme--hayalet');
        button.type='button';form.appendChild(button);
        const sonDurum=h('p','','r-kd-not');sonDurum.setAttribute('aria-live','polite');
        form.appendChild(sonDurum);
        const history=h('ol',null,'r-kd-karar-gecmis');
        bolum.appendChild(form);bolum.appendChild(history);
        const yenile=()=>{
          const item=sicil.bul(kod,bag.belge,bag.pid||'_pid_yok_');
          history.textContent='';
          if(!item){sonDurum.textContent='Bu fiş bağlantısında karar bulunmuyor · Matbu teyit: bekliyor';return;}
          const v=item.son;
          karar.value=v.karar;matbu.value=v.matbuDurum;gerekce.value=v.gerekce;
          sayfa.value=v.matbuSayfa;delil.value=v.matbuDelil;inceleyen.value=v.inceleyen;
          sonDurum.textContent='Karar: '+v.karar+' · Matbu: '+v.matbuDurum+
            ' · Geçmiş: '+item.gecmis.length;
          for(const ev of item.gecmis)
            history.appendChild(h('li',ev.tarih+' · '+ev.karar.karar+' · matbu: '+
              ev.karar.matbuDurum+' · gerekçe: '+ev.karar.gerekce));
        };
        button.onclick=()=>{
          try{
            sicil.kaydet({kod,belge:bag.belge,pid:bag.pid||'_pid_yok_',
              dijitalDurum:dijital,karar:karar.value,matbuDurum:matbu.value,
              matbuSayfa:sayfa.value,matbuDelil:delil.value,
              gerekce:gerekce.value,inceleyen:inceleyen.value});
            yenile();sicilDurum('Karar bellekte. Kalıcı tutmak için JSON indirin.');
          }catch(e){sonDurum.textContent='Kaydedilmedi: '+(e.message||e);}
        };
        sicilYenile.push(yenile);yenile();
        return bolum;
      };

      const counts=h('div',null,'r-kd-sayaclar');root.appendChild(counts);
      const filter=h('select',null,'r-kd-filtre');

      // İkinci, bağımsız Hattâbî denetimi: ilk 24 fiş korunur, kalan 35

      const partiArac=h('div',null,'r-kd-pilot-arac');

      let partiCalisiyor=false,partiIptal=false;

      partiBaslat.onclick=async()=>{
        if(partiCalisiyor)return; // Çift başlatma yok.
        const id='SRC-HTB-ALAM',kaynak=app.paket&&app.paket.belge(id);
        if(!kaynak||!kaynak.yerel){
          partiDurum.textContent='Hattâbî kaynak paketi bu tarayıcıda henüz hazır değil; Oku bölümünden yükleyin. Otomatik indirme yapılmadı.';

        // Bu 35 fişin kodlarını sabit tut: tarayıcıya yeni fiş eklenmesi

            ' · Teyit gerekli '+say.teyit+' (komşu paragraf '+say.kapsam+

            '';
        };
        try {
          ilerle();
          for(const rec of aday){
            if(partiIptal||!parti.isConnected)break;
            const fis=app.veri.fis(rec.kod);
            const baglar=rec.links.filter(b=>b.belge===id);
            for(const bag of baglar){
              if(partiIptal||!parti.isConnected)break;
              let p=null,onceki=null,sonraki=null,sonuc;
              if(!fis){sonuc={tur:'teyit',baslik:'Fiş kaydı yüklenemedi',not:'Bu fiş için otomatik doğrulama yapılmadı.'};}
              else if(!bag.pid){sonuc={tur:'hata',baslik:'Kaynak paragraf bağlantısı eksik',not:'PID boş. Kaynak bağı elle incelenmeli.'};}
              else {
                try {
                  p=await app.paket.paragraf(bag.belge,bag.pid);
                  if(partiIptal||!parti.isConnected)break;
                  const temiz=pilotAlinti(fis.ar);

              const tur=Object.prototype.hasOwnProperty.call(say,sonuc.tur)?sonuc.tur:'teyit';
              const kapsam=sonuc.baslik==='Alıntı komşu paragraflara yayılıyor';
              say[tur]++;bagSayisi++;if(kapsam)say.kapsam++;
              const satir=h('article',null,'r-kd-kayit r-kd-parti-kayit');

              satir.appendChild(h('p','Dijital durum: '+tur+' · Matbu teyit: bekliyor','r-kd-not'));
              const kart=h('button','Fiş kimlik kartını aç','r-dugme r-dugme--hayalet r-dugme--kucuk');
              kart.type='button';
              kart.onclick=()=>{
                if(typeof app.nesne==='function'&&app.cekmece&&app.cekmece.ac){
                  app.nesne({tur:'fis',id:rec.kod});
                  app.cekmece.ac('kimlik',{kaynak:'fare',sonOdak:kart});

              satir.appendChild(kart);
              satir.appendChild(kararPanel(rec.kod,bag,tur));
              const detay=h('details');
              detay.appendChild(h('summary','Fiş Arapçası, işaretli metin ve dijital kaynağı göster'));

                  detay.appendChild(h('p',p.metin.slice(bag.secimBas,bag.secimSon),'r-kd-arapca'));

                detay.appendChild(h('strong','Bağlı Arapça paragraf'));
                detay.appendChild(h('p',String(p.metin||''),'r-kd-arapca'));
                if(tur==='supheli'&&fis){
                  const kanit=lafizKaniti(fis.ar,p,bag);
                  if(kanit){
                    detay.appendChild(h('p','En uzun ortak lafız dizisi: '+kanit.ortakKelime+'/'+
                      kanit.alintiKelime+' kelime. Matbu teyit değildir.','r-kd-not'));
                    if(kanit.ortakDizi)detay.appendChild(h('p',kanit.ortakDizi,'r-kd-arapca'));
                  }

                if(onceki){detay.appendChild(h('strong','Önceki Arapça paragraf'));detay.appendChild(h('p',String(onceki.metin||''),'r-kd-arapca'));}
                if(sonraki){detay.appendChild(h('strong','Sonraki Arapça paragraf'));detay.appendChild(h('p',String(sonraki.metin||''),'r-kd-arapca'));}
              }
              satir.appendChild(detay);partiSonuc.appendChild(satir);partiGoster();
            }
            if(partiIptal||!parti.isConnected)break;

          if(parti.isConnected){

      const area=h('div',null,'r-kd-sonuclar');root.appendChild(area);

      line(counts,'Fiş',sum.toplam);line(counts,'Yapısal hata',sum.hata);
      line(counts,'Şüpheli',sum.supheli);line(counts,'Teyit bekleyen',sum.teyit);
      line(counts,'Bağlantısız',sum.baglantisiz);

        area.textContent='';
        const rows=items.filter(x=>filter.value==='hepsi'||(filter.value==='baglantili'&&x.links.length>0)||(filter.value==='baglantisiz'&&x.links.length===0)||filter.value===x.durum);

          const box=h('article',null,'r-kd-kayit');

          box.appendChild(h('span',rec.durum,'r-kd-durum'));
          for(const item of rec.bulgular.slice(0,5))box.appendChild(h('p',item.baslik+' — '+item.not,'r-kd-bulgu'));
          // Aynı fiş birden fazla paragrafla ilişkilendirilebilir.
          // İlk bağla sınırlamak diğer yanlış bağlantıları gizler. Her hazır
          // bağlantıyı kullanıcı isteğiyle ve birbirinden bağımsız denetle.
          const baglar=rec.links.filter(x=>x.belge&&x.pid);
          const hazir=baglar.filter(x=>app.paket&&app.paket.belge(x.belge)?.yerel);
          if (baglar.length>1) box.appendChild(h('p',baglar.length+' kaynak bağlantısı · '+hazir.length+' yerelde hazır','r-kd-not'));

            const btn=h('button',(n+1)+'. kaynak paragrafını doğrula','r-dugme r-dugme--hayalet r-dugme--kucuk');

            const aciklama=h('span',ready.belge+' · '+ready.pid,'r-kd-kaynak');
            const sonucAlani=h('div',null,'r-kd-derin-sonuc');
            const alan=h('div',null,'r-kd-bag');alan.appendChild(aciklama);
            alan.appendChild(btn);alan.appendChild(sonucAlani);box.appendChild(alan);
            btn.onclick=async()=>{
              if(btn.disabled)return;
              btn.disabled=true;btn.textContent='Kontrol ediliyor…';
              sonucAlani.textContent='';
              try {
                const fis=app.veri.fis(rec.kod);
                const p=await app.paket.paragraf(ready.belge,ready.pid);
                const result=derinSonuc(fis,ready,p);
